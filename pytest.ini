[pytest]
# Your comprehensive settings are kept
pythonpath = src
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -ra
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    slow: Slow running tests
    phase1: Phase 1 tests (completeness only)
    phase2: Phase 2 tests (consistency)
    phase3: Phase 3 tests (freshness)
minversion = 7.0

[cov:run]
# THIS IS THE FIX:
# We explicitly tell coverage to measure the 'src' directory,
# not the whole repository ('.'). This solves the 0% coverage error.
source = src

[cov:report]
# Merged from both versions:
precision = 2
show_missing = True
skip_covered = False
fail_under = 50  # <-- This enforces our 50% minimum

# Your excellent exclusion list:
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:

[cov]
# Omit packaging files from coverage, as they don't need to be tested.
omit =
    src/__init__.py
    src/components/__init__.py
    src/governance/__init__.py
