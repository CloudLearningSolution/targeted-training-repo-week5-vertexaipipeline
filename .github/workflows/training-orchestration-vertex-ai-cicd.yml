# # Vertex AI CI/CD - Train Model (Dev & Prod)
# # ------------------------------------------
# # This workflow automates the ML pipeline for both development and production
# # using Google Cloud Vertex AI. It is triggered by pushes to 'main', pull
# # requests to 'main', or manual invocation. The workflow covers pipeline
# # compilation, model training, approval gating, and deployment.
# #
# # All comments and documentation lines are kept <= 100 characters for .flake8.

# # =============================================================================
# # Lab 5.4: Vertex AI Pipeline Component Architecture Exploration
# # =============================================================================
# # This CI/CD workflow demonstrates the orchestration of Vertex AI Pipeline
# # components through automated deployment. Understanding this workflow helps
# # identify how pipeline components are compiled, executed, and managed at scale.
# #
