# # TODO: Lab 5.4.2 - Purpose Recognition: Automated pipeline deployment and execution
# # TODO: Lab 5.4.3 - Architecture Understanding: Pipeline compilation → execution → deployment flow

# # =============================================================================
# # Lab 5.5: Vertex AI Custom Components and Pre-built Components and Accelerator Templates
# # =============================================================================
# # CRITICAL: Understanding GitHub Actions vs Terraform Orchestration
# # =============================================================================
# #
# # THIS FILE (GitHub Actions - vertex-ai-cicd.yml):
# # ------------------------------------------------
# # ROLE: Orchestrates ML WORKFLOW on every code commit
# # WHEN: Runs automatically when code is pushed to repository
# # WHAT: Compiles pipelines → Runs pipelines → Deploys models
# # FREQUENCY: Multiple times per day (every commit)
# # WHO: Triggered by ML engineers committing code changes
# #
# # TERRAFORM FILE (vertex_ai_infrastructure.tf):
# # ---------------------------------------------
# # ROLE: Provisions INFRASTRUCTURE once or when infrastructure changes
# # WHEN: Run manually by platform team during initial setup
# # WHAT: Creates GCS buckets, service accounts, IAM roles, endpoints, BigQuery datasets
# # FREQUENCY: Infrequently (weeks/months between runs)
# # WHO: Platform/infrastructure engineers
# #
# # DEPLOYMENT SEQUENCE:
# # ===================
# # STEP 1 (ONE TIME - Terraform):
# #   Platform engineer runs: terraform apply
# #   └─> Creates infrastructure: buckets, service accounts, endpoints, BigQuery resources
# #   └─> Result: Foundation ready for ML workflows
# #
# # STEP 2 (EVERY COMMIT - This GitHub Actions File):
# #   ML engineer: git push to main branch
# #   └─> Triggers this workflow automatically
# #   └─> Compiles pipelines (compiler.py)
# #   └─> Runs dev pipeline (run_pipeline.py) [uses Terraform-created infrastructure]
# #   └─> Awaits manual approval
# #   └─> Runs prod pipeline (run_pipeline.py) [uses Terraform-created infrastructure]
# #   └─> Deploys model (deploy_model.py) [uses Terraform-created endpoint]
# #
# # KEY INSIGHT:
# # ===========
# # This workflow ASSUMES infrastructure already exists (created by Terraform).
# # It focuses on ML workflow orchestration, not infrastructure provisioning.
# # Terraform and GitHub Actions are COMPLEMENTARY, not competing orchestrators.
# #
# # TODO: Lab 5.5.3 - Accelerator Templates: This workflow uses Terraform-provisioned infrastructure
# # TODO: Lab 5.5.3 - Separation of Concerns: Infrastructure (Terraform) vs Workflow (GitHub Actions)
# # =============================================================================

