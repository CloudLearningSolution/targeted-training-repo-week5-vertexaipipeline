# # =============================================================================
# # Lab 5.5 Orchestration Summary: GitHub Actions vs Terraform
# # =============================================================================
# # This workflow demonstrates ML WORKFLOW ORCHESTRATION, which is separate from
# # but dependent on INFRASTRUCTURE PROVISIONING:
# #
# # INFRASTRUCTURE LAYER (Terraform - vertex_ai_infrastructure.tf):
# # ---------------------------------------------------------------
# # Run: ONE TIME or when infrastructure changes
# # Creates:
# #   - GCS buckets (SHARED_MLOPS_BUCKET_NAME)
# #   - Service accounts (VERTEX_PIPELINE_SERVICE_ACCOUNT)
# #   - IAM permissions
# #   - BigQuery datasets and Feature Groups
# #   - Vertex AI endpoints
# # Purpose: Provides foundational infrastructure for ML workflows
# # Frequency: Infrequently (weeks/months)
# #
# # WORKFLOW LAYER (This File - GitHub Actions):
# # --------------------------------------------
# # Run: EVERY CODE COMMIT automatically
# # Uses infrastructure from Terraform:
# #   - Uploads artifacts to Terraform-created GCS buckets
# #   - Uses Terraform-created service accounts for authentication
# #   - Queries Terraform-created BigQuery datasets
# #   - Deploys models to Terraform-created endpoints
# # Purpose: Orchestrates ML pipeline compilation, execution, and deployment
# # Frequency: Frequently (multiple times per day)
# #
# # COMPLETE ENTERPRISE WORKFLOW:
# # =============================
# # 1. Platform Team (One Time):
# #    └─> terraform apply (creates infrastructure)
# #
# # 2. ML Engineers (Continuous):
# #    └─> git push (triggers this workflow)
# #        ├─> Compiles pipelines
# #        ├─> Runs dev pipeline [uses Terraform infrastructure]
# #        ├─> Awaits approval
# #        ├─> Runs prod pipeline [uses Terraform infrastructure]
# #        └─> Deploys model [uses Terraform infrastructure]
# #
# # BIGQUERY INTEGRATION IN WORKFLOW:
# # =================================
# # Parameter Changes Summary:
# #
# # Dev Pipeline Parameters:
# #   OLD: {project_id, region, model_display_name, input_raw_data_gcs_uri, reg_rate, min_accuracy}
# #   NEW: {project_id, region, model_display_name, bq_dataset, bq_view, reg_rate, min_accuracy}
# #
# # Prod Pipeline Parameters:
# #   OLD: {project_id, region, model_display_name, input_raw_data_gcs_uri, reg_rate, min_accuracy, parent_model}
# #   NEW: {project_id, region, model_display_name, bq_dataset, bq_view, reg_rate, min_accuracy, parent_model}
# #
# # Benefits:
# # - Pipelines now query BigQuery directly (serverless, scalable)
# # - No GCS file downloads needed
# # - Feature Groups provide governance layer
# # - SQL-based train/test splitting
# # - Same view used for dev and prod (consistency)
# #
# # KEY INSIGHT FOR LAB 5.5:
# # ========================
# # This workflow ORCHESTRATES ML activities.
# # Terraform PROVISIONS infrastructure (including BigQuery resources).
# # They are complementary layers in the Accelerator Template architecture.
# #
# # TODO: Lab 5.5.3 - Accelerator Templates: GitHub Actions uses Terraform-provisioned infrastructure
# # TODO: Lab 5.5.3 - Separation of Concerns: Workflow orchestration vs infrastructure provisioning
# # TODO: Lab 5.5.5 - BigQuery Integration: Complete parameter migration from GCS to BigQuery
# # =============================================================================

# # =============================================================================
# # Lab 5.6.6 — CI/CD Workflow Steps, Secret Usage, and Artifact Flow Summary
# # =============================================================================
# #
# # COMPLETE CI/CD WORKFLOW OVERVIEW:
# # ==================================
# # This workflow orchestrates 5 jobs in sequence:
# # 1. setup-and-compile-gcp → Compile pipelines
# # 2. train-dev-vertex → Run development pipeline
# # 3. require-approval → Manual approval gate
# # 4. train-prod-vertex → Run production pipeline
# # 5. deploy-model → Deploy to endpoint
# #
# # JOB DEPENDENCY GRAPH:
# # ====================
# # setup-and-compile-gcp (compile YAMLs)
# #   ↓
# # train-dev-vertex (dev pipeline execution)
# #   ↓
# # require-approval (manual gate)
# #   ↓
# # train-prod-vertex (prod pipeline execution)
# #   ↓
# # deploy-model (endpoint deployment)
# #
# # SECRETS USED IN WORKFLOW:
# # =========================
# # | Secret Name | Purpose | Used In Jobs |
# # |-------------|---------|--------------|
# # | GCP_PROJECT_ID | GCP project identifier | All jobs |
# # | GCP_SHARED_MLOPS_BUCKET_NAME | GCS bucket for artifacts | All pipeline jobs |
# # | VERTEX_PIPELINE_SA_EMAIL | Service account for pipeline execution | train-dev, train-prod |
# # | GCP_PROJECT_NUMBER | Numeric project ID for workload identity | All jobs (auth) |
# # | GCP_WORKLOAD_IDENTITY_POOL_ID | Workload identity pool | All jobs (auth) |
# # | GCP_WORKLOAD_IDENTITY_PROVIDER_ID | Identity provider | All jobs (auth) |
# # | GHA_SERVICE_ACCOUNT_EMAIL | GitHub Actions service account | All jobs (auth) |
# #
# # ARTIFACT FLOW (COMPLETE):
# # =========================
# # 1. COMPILATION PHASE (Job 1):
# #    vertex_pipeline_dev.py → compiler.py → vertex_pipeline_dev.yaml (local)
# #    vertex_pipeline_prod.py → compiler.py → vertex_pipeline_prod.yaml (local)
# #
# # 2. ARTIFACT UPLOAD (Job 1):
# #    Local YAMLs → upload-artifact action → GitHub Actions artifact storage
# #    Artifact name: compiled-vertex-pipelines
# #
# # 3. ARTIFACT DOWNLOAD (Jobs 2 & 4):
# #    GitHub Actions artifact storage → download-artifact action → ./compiled-pipelines/
# #
# # 4. PIPELINE SUBMISSION (Jobs 2 & 4):
# #    ./compiled-pipelines/vertex_pipeline_[dev|prod].yaml → run_pipeline.py
# #    → Uploads to GCS (pipeline-root path) → Vertex AI reads from GCS
# #
# # 5. MODEL REGISTRATION (During Pipeline Execution):
# #    Pipeline trains model → register_model_op → Vertex AI Model Registry
# #
# # 6. MODEL DEPLOYMENT (Job 5):
# #    Model Registry (latest model) → deploy_model.py → Vertex AI Endpoint
# #
# # COMPLETE ARTIFACT FLOW DIAGRAM:
# # ===============================
# # Code Repository
# #   ↓ (git push)
# # GitHub Actions Runner
# #   ↓ (compile)
# # Local YAML Files
# #   ↓ (upload)
# # GitHub Artifact Storage
# #   ↓ (download)
# # Runner ./compiled-pipelines/
# #   ↓ (submit via run_pipeline.py)
# # GCS Bucket (pipeline-root)
# #   ↓ (Vertex AI reads)
# # Vertex AI Pipeline Execution
# #   ↓ (train & register)
# # Vertex AI Model Registry
# #   ↓ (deploy via deploy_model.py)
# # Vertex AI Endpoint (Serving)
# #
# # PARAMETER INJECTION MECHANISM:
# # ==============================
# # 1. Environment Variables (defined at workflow level)
# #    ↓
# # 2. jq Command (constructs JSON in job steps)
# #    ↓
# # 3. PARAMS_JSON Variable (JSON string)
# #    ↓
# # 4. run_pipeline.py --parameter-values-json flag
# #    ↓
# # 5. json.loads() in run_pipeline.py (string → dict)
# #    ↓
# # 6. PipelineJob(parameter_values=dict)
# #    ↓
# # 7. Vertex AI passes to pipeline function
# #    ↓
# # 8. Individual components receive parameters
# #
# # STEP ORDERING RATIONALE:
# # ========================
# # 1. setup-and-compile-gcp MUST run first
# #    - Produces artifacts needed by all other jobs
# #    - Validates pipeline structure before execution
# #
# # 2. train-dev-vertex runs before train-prod-vertex
# #    - Test in dev environment first
# #    - Catch issues before production
# #    - Dev failures don't trigger prod
# #
# # 3. require-approval between dev and prod
# #    - Human verification of dev results
# #    - Prevents automatic prod deployment
# #    - Quality gate for production
# #
# # 4. train-prod-vertex includes delay (sleep 120)
# #    - Prevents quota contention
# #    - Allows dev pipeline to complete
# #    - Staggers resource usage
# #
# # 5. deploy-model runs last
# #    - Requires successful prod pipeline
# #    - Model must be in registry before deployment
# #    - Final step in complete workflow
# #
# # WHY STEPS ARE ORDERED THIS WAY:
# # ===============================
# # - Compilation before execution (can't run without YAML)
# # - Dev before prod (test first, deploy later)
# # - Approval before prod (human oversight)
# # - Prod before deployment (model must exist)
# # - Each step builds on previous success
